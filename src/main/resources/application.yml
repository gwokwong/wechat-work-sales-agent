server:
  port: 8080

spring:
  application:
    name: wechat-sales-agent
  profiles:
    # 默认启用 demo 演示环境（H2 + MockChannel + MockLLM + 人工审批）。
    # 接入真实环境请使用 -Dspring-boot.run.profiles=mysql 并修改 application-mysql.yml。
    default: demo
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  # 人工闸门：MANUAL=每条约话术必须人工确认后才发送；AUTO=审批通过策略后自动发送（演示不建议）
  approval-mode: MANUAL
  channel:
    # 可选值：mock（默认） / wecom（真实企微，未接入时会抛明确错误）
    active: mock
  mock:
    # 是否启动 Mock 演示自动流水线（每分钟注入一条模拟客户消息）
    enabled: true
    # 注入间隔（毫秒），按“每分钟一条”的规格默认 60000
    interval-ms: 60000
    first-delay-ms: 15000
    customer-a-id: wxid_demo_001
    customer-b-id: wxid_demo_002
  compliance:
    # 敏感词/不合规词，命中即阻断自动发送
    sensitive-words:
      - 保证
      - 承诺100%
      - 返现
      - 私下转账
      - 绝对
      - 百分百
      - 竞品XX
      - 免费送
    # 正则规则（可外置扩展）：命中即阻断，用于拦截银行卡/身份证号等号码类内容
    # 说明：演示默认给出 1 条不误伤演示话术的号码正则；生产可按需增删（如手机号 \b1[3-9]\d{9}\b）
    blocked-patterns:
      - \b\d{15,18}\b
    # 与 blocked-patterns 一一对应的规则名（英文逗号分隔，个数不足时自动回退正则原文）
    # 示例：blocked-patterns 配 2 条时写：银行卡身份证号码,手机号码
    pattern-rule-names: 银行卡/身份证号码
  quote:
    http:
      # true=对接真实报价系统（注册 HttpQuoteService，MockQuoteService 停用）；默认 false 保持 Mock 演示
      enabled: false
      # 内部报价系统根地址，例如 http://quote.internal.example.com
      base-url: ""
      # 调用报价系统鉴权 Key（建议环境变量注入），适配器以 X-API-Key 头发送
      api-key: ""
  # ===== 截图工作流（DESIGN.md 截图上传 → OCR → 复用 agent 编排）=====
  screenshot:
    # 上传图片落盘根目录（相对应用工作目录），静态资源映射 /uploads/screenshot/** 指向此处
    upload-dir: ./data/screenshot
    # 话术导出文件落盘目录，静态资源映射 /uploads/export/** 指向此处
    export-dir: ./data/export
    # 单张图片大小上限（字节，默认 5MB）
    max-upload-bytes: 5242880
    # 单次批量上传识别的截图张数上限
    max-batch-count: 9
    # 允许的图片扩展名
    allowed-extensions: png,jpg,jpeg,webp,bmp
  # ===== 截图 OCR 识别 =====
  ocr:
    # auto=按「本机 tesseract → 外部 OCR 服务 → 占位兜底(前端手动粘贴)」顺序探测；
    # external=强制走外部服务；off=关闭识别直接返回占位文本
    mode: auto
    # tesseract 可执行文件绝对路径（显式指定，不依赖后端进程启动时的 PATH 快照）
    tesseract-path: C:/Program Files/Tesseract-OCR/tesseract.exe
    # tesseract 语言包参数（缺中文包时可回退 eng）
    tesseract-lang: chi_sim+eng
    # 外部 OCR 服务根地址（POST {base-url}/ocr，json {"imageBase64":"..."}，返回 {"text":"..."}）；留空且无本机 OCR 时走占位兜底
    external-base-url: ""
    # 外部 OCR 服务鉴权 Key（可选，以 X-API-Key 头发送）
    external-api-key: ""
  llm:
    # 话术生成模型开关：true=MockLLMClient（规则个性化演示，默认，无需外部依赖）；
    # 联调真实模型时置 false 并填写下方 base-url / api-key / model（建议通过环境变量注入）
    mock: true
    # OpenAI 兼容根地址（自动拼接 /chat/completions），如 https://api.deepseek.com/v1
    base-url: ""
    # API Key（建议 ${DEEPSEEK_API_KEY:} 环境变量注入，勿写死），请求以 Authorization: Bearer 头发送
    api-key: ""
    # 模型名，如 deepseek-chat
    model: ""
    # 采样温度（0~1，越高越发散；润色类任务推荐 0.3~0.7）
    temperature: 0.7
    # HTTP 连接/读取超时（秒）
    timeout-seconds: 30
  wecom:
    # ---- 外发频率限制（客户级令牌桶，DESIGN.md §7.4 / §10 B1；默认关闭不影响演示）----
    rate-limit-enabled: false
    # 令牌桶容量：单客户可立即连续发送的条数
    rate-limit-capacity: 5
    # 令牌补充速率：每秒补充条数（0.05 ≈ 每 20 秒补 1 个令牌）
    rate-limit-per-second: 0.05
    # ---- 外发长文本分片（DESIGN.md §10 B7；企微文本消息建议上限 2048）----
    # 单条外发最大字符数：超过则按换行边界拆分为多条顺序发送并加编号前缀
    max-outbound-length: 2048
    # ===== 真实企微接入配置（占位，勿在 M0 使用）=====
    # corpId / 会话存档 secret / 回调 Token / 回调 EncodingAESKey / 会话存档私钥
    corp-id: YOUR_CORP_ID
    session-secret: YOUR_SESSION_ARCHIVE_SECRET
    callback-token: YOUR_CALLBACK_TOKEN
    callback-aes-key: YOUR_CALLBACK_AES_KEY
    # RSA 私钥（会话存档数据解密用），建议从环境变量注入而不是写死在配置里
    session-archive-private-key: YOUR_PRIVATE_KEY_PEM
    # 应用 AgentId（发送客户消息需要“客户联系”secret + 员工可发送客户消息的授权）
    agent-id: 1000002
    app-secret: YOUR_APP_SECRET
